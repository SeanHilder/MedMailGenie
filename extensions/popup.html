<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedMailGenie</title>
    <link rel="stylesheet" href="/src/popup/styles.css" />
    <script type="module" src="/src/popup/index.ts"></script>
  </head>
  <body>
    <div class="container">
      <div class="brand-header">
        <img
          src="/assets/medmailgenie.png"
          alt="MedMailGenie"
          class="brand-logo"
        />
      </div>
      <div class="status-banner">
        <span class="status-dot"></span>
        <span> AI Assistant Ready </span>
      </div>
      <div class="card">
        <div class="section-title">Current Email</div>
        <div class="email-field">
          <div class="label">From</div>
          <div class="value" id="emailSender">No email loaded</div>
        </div>
        <div class="email-field">
          <div class="label">Subject</div>
          <div class="value" id="emailSubject">No email loaded</div>
        </div>
        <div class="email-meta">
          <div class="meta-item">
            <div class="label">Priority</div>
            <span class="badge priority"> Unknown </span>
          </div>
          <div class="meta-item">
            <div class="label">Topic</div>
            <span class="badge category"> Unknown </span>
          </div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">AI Summary</div>
        <p class="summary" id="summaryText">Loading summary...</p>
      </div>
      <div class="card">
        <div class="section-title">Tasks &amp; Deadlines</div>
        <ul
          class="summary"
          id="tasksList"
          style="margin: 0; padding-left: 18px"
        >
          Loading tasks...
        </ul>
        <div
          id="calendarButtons"
          style="
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
          "
        ></div>
      </div>
      <div class="card">
        <div class="reply-heading">
          <div class="section-title">Suggested Reply</div>
          <div class="reply-actions">
            <button
              class="reply-icon-button"
              id="regenerateBtn"
              type="button"
              aria-label="Regenerate reply"
              title="Regenerate reply"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <path d="M21 3v5h-5" />
                <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" />
              </svg>
            </button>
            <button
              class="reply-icon-button"
              id="copyBtn"
              type="button"
              aria-label="Copy reply"
              title="Copy reply"
            >
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <rect x="8" y="8" width="12" height="12" rx="2" />
                <path
                  d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"
                />
              </svg>
            </button>
          </div>
        </div>
        <textarea
          id="replyBox"
          aria-label="Suggested reply"
          placeholder="Open a Gmail email to generate a reply."
        ></textarea>
        <div class="tone-row">
          <div class="label">Tone</div>
          <select id="toneSelect">
            <option value="professional">Professional</option>
            <option value="friendly">Friendly</option>
            <option value="concise">Concise</option>
            <option value="formal">Formal</option>
          </select>
        </div>
        <div class="voice-row">
          <button class="voice-button" id="voiceBtn">Voice</button>
          <button class="voice-button" id="readBtn">Read Aloud</button>
        </div>
        <div class="utility-row">
          <button class="utility-button" id="clearBtn">Clear</button>
        </div>
        <div class="review-row">
          <button class="approve-button" id="approveBtn" disabled>
            Approve
          </button>
        </div>
        <div
          class="feedback"
          id="feedbackMessage"
          role="status"
          aria-live="polite"
        ></div>
      </div>
      <div class="footer">
        Approve inserts your reply into Gmail. Review it there and click Send
        yourself.
      </div>
    </div>
  </body>
</html>
